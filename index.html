<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        @font-face {
            font-family: 'Neue_Reg';
            src: url('./assets/fonts/NeueMontreal-Regular.otf');
        }

        @font-face {
            font-family: 'LayGrotesk_Reg';
            src: url('./assets/fonts/laygrotesk-trial-regular.otf');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none;
            list-style: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Neue_Reg';
            color: #101010;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        footer {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-inline: 2rem;
            padding-top: 3rem;
            width: 100%;
            height: 100dvh;
            background-color: #EDECEC;
            overflow: hidden;
            max-width: 1600px;
            margin-inline: auto;
        }

        .content {
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: flex-start;
        }

        .left {
            display: flex;
            flex-direction: column;
            row-gap: 48px;
            width: max-content;
        }

        .tagline {
            font-size: 32px;
            line-height: 1;
        }

        form {
            padding-block: 4px;
            border-bottom: 2px solid #B9B9B9;
            position: relative;
        }

        form input {
            width: 100%;
            outline: none;
            padding-inline: 0;
            border: none;
            padding-top: 4px;
            background: transparent;
            font-family: inherit;
            font-size: inherit;

        }

        form input::placeholder {
            color: #B9B9B9;
        }

        .arrow {
            position: absolute;
            top: calc(50% + 4px);
            right: 0;
            transform: translateY(-50%);
        }

        .right {
            display: grid;
            grid-template-columns: repeat(2, max-content);
            /* grid-row: repeat(2, max-content); */
            gap: 64px;
        }

        .links div {
            cursor: pointer;
            width: max-content;
            position: relative;
        }

        .links div::after {
            content: '';
            width: 100%;
            height: 1px;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #101010;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s cubic-bezier(0.85, 0, 0.15, 1);
        }

        .links div:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }


        .socials div {
            border-bottom: 1.5px solid #101010;
            width: max-content;
            overflow: hidden;
        }

        .socials div span {
            display: inline-block;
            position: relative;
            top: 1.1px;
            position: relative;
            transition: transform 0.3s ease-in-out;
        }

        .socials div span::before {
            content: '↗';
            color: #101010;
            position: absolute;
            top: 100%;
            right: 100%;
        }

        .socials a:hover div span {
            transform: translate(100%, -100%);
        }

        .display {
            font-family: 'LayGrotesk_Reg';
            /* font-size: calc(-23px + 34.7vw); */
            font-size: clamp(88px, calc(-23px + 34.688vw), 532px);
            line-height: 1;
            overflow: hidden;
            text-align: center;
            /* Some small issue using this approach for width > 1500px */
            /* position: relative;
            top: 0.41em; */
            color: white;
            margin-bottom: -0.42em;
        }


        @media (max-width: 768px) {
            .content {
                flex-direction: column;
                row-gap: 32px;
            }

            .right {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>
    <footer>
        <div class="content">
            <div class="left">
                <div class="tagline">Built with precision.</div>
                <div class="contact-info">
                    <div>New Business</div>
                    <div>hello@ocho.com</div>
                </div>
                <div class="form">
                    <div>Sign up for our newsletter (No spam)</div>
                    <form action="#">
                        <input type="email" placeholder="Email">
                        <div class="arrow">→</div>
                    </form>
                </div>
            </div>
            <div class="right">
                <div class="links">
                    <div>Home</div>
                    <div>Work</div>
                    <div>About</div>
                    <div>News</div>
                </div>
                <div class="socials">
                    <a href="#">
                        <div>Instagram <span>↗</span></div>
                    </a>
                    <a href="#">
                        <div>Linkedin <span>↗</span></div>
                    </a>
                </div>
                <div class="HQs">
                    <div>New York / USA</div>
                    <div>San Francisco / USA</div>
                    <div>Dubai / UAE</div>
                </div>
                <div>
                    Terms of Use<br>
                    <span style="font-size: 15px;">@2019-2026</span>
                </div>
            </div>
        </div>
        <div class="display">
            OCHO
        </div>
    </footer>
</body>
</html>
